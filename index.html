<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">TypeScript sample</p>
      <h1 class="title" data-user-name>Guest</h1>
      <p class="meta">
        <span data-user-age>25</span> years
        <span class="dot">&bull;</span>
        <span class="status-badge is-active" data-user-status>Active</span>
      </p>
      <p class="note">Values come from <code>src/index.ts</code>. Open the console to see the log.</p>
      <button class="cta" type="button" data-toggle-status>Toggle status</button>
    </section>
  </main>
  <script src="dist/index.js"></script>
</body>
</html>
